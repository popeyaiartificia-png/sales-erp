<!doctype html>
<html lang="en" data-theme="dark">
<head>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0a0c18;--bg2:#0f1226;--panel:#141833;--panel2:#1c2147;--line:#262c58;--line2:#323a72;
  --text:#eceeff;--muted:#8d93c9;--faint:#5d6396;
  --accent:#7c5cff;--accent2:#22d3ee;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--gold:#fbbf24;
  --hot:#ff5a36;--warm:#f5b20b;--cold:#38bdf8;
  --shadow:0 12px 32px rgba(0,0,0,.35);--r:12px;
}
[data-theme=light]{
  --bg:#f3f4fb;--bg2:#eceefb;--panel:#ffffff;--panel2:#f1f2fb;--line:#e1e4f3;--line2:#cfd4ee;
  --text:#14183a;--muted:#646a96;--faint:#9aa0c6;
  --accent:#6a48ff;--accent2:#0ea5c6;--shadow:0 10px 28px rgba(40,46,110,.10);
  --hot:#f0441c;--warm:#d99400;--cold:#0b8fd4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 420px at 0% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),
             radial-gradient(700px 420px at 100% 0%,color-mix(in srgb,var(--accent2) 9%,transparent),transparent 70%)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,.num{font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
h1{font-size:22px}h2{font-size:19px}h3{font-size:16px}h4{font-size:14px}
.ic{width:16px;height:16px;flex:none}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.xs{font-size:11px}
.row{display:flex;align-items:center}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap12{gap:12px}.grow{flex:1;min-width:0}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;position:relative;z-index:1}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);
  background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:16px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.logo .ic{width:17px;height:17px}
.nav{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav .ic{width:18px;height:18px}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 24%,transparent),transparent);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;background:var(--panel2);color:var(--text);padding:1px 7px;border-radius:99px}
.nav .cnt.hot{background:color-mix(in srgb,var(--hot) 22%,transparent);color:var(--hot)}
main{padding:22px 30px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px}

/* components */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.pad0{padding:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);
  font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .08s,filter .15s,background .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent2)));border-color:transparent;color:#fff;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:6px}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:6px}
.btn.icon{padding:7px}
.btn.wa{color:#1fbf5b}.btn.call{color:var(--accent2)}
.btn[disabled]{opacity:.45;pointer-events:none}
input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--muted);font-weight:600}
label>input,label>select,label>textarea{margin-top:5px;font-size:14px;color:var(--text);font-weight:400}
label.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);font-weight:500}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{accent-color:var(--accent);width:100%}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.bar.lg{height:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.due{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.new{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.tag.icp{background:color-mix(in srgb,var(--accent) 18%,transparent);color:color-mix(in srgb,var(--accent) 70%,var(--text))}
.t-hot{color:var(--hot);background:color-mix(in srgb,var(--hot) 15%,transparent)}
.t-warm{color:var(--warm);background:color-mix(in srgb,var(--warm) 15%,transparent)}
.t-cold{color:var(--cold);background:color-mix(in srgb,var(--cold) 15%,transparent)}
.tag.t-hot::before,.tag.t-warm::before,.tag.t-cold::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.odot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0;flex:none}
.st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.st-interested{color:var(--hot);background:color-mix(in srgb,var(--hot) 13%,transparent)}
.st-won{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.st-lost,.st-invalid{color:var(--faint)}
.st-contacted{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 12%,transparent)}
.tsw{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.tsw button{border:0;background:none;padding:4px 10px;border-radius:5px;cursor:pointer;font-weight:600;font-size:12px;color:var(--faint)}
.tsw.mini button{padding:2px 6px;font-size:11px}
.tsw button.on.hot{background:color-mix(in srgb,var(--hot) 20%,transparent);color:var(--hot)}
.tsw button.on.warm{background:color-mix(in srgb,var(--warm) 20%,transparent);color:var(--warm)}
.tsw button.on.cold{background:color-mix(in srgb,var(--cold) 20%,transparent);color:var(--cold)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg2);padding:5px 11px;border-radius:6px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.seg button.on.hot{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 16%,transparent)}
.seg button.on.warm{border-color:var(--warm);background:color-mix(in srgb,var(--warm) 16%,transparent)}
.seg button.on.cold{border-color:var(--cold);background:color-mix(in srgb,var(--cold) 16%,transparent)}
.seg b{font-weight:700;color:var(--text);margin-left:3px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}

/* hero / dashboard */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,var(--panel)),var(--panel) 60%,color-mix(in srgb,var(--accent2) 14%,var(--panel)))}
.hero h2{margin:4px 0 12px}
.hero .xpline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.hstats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.hstats .num{font-size:22px;font-weight:700}
.ringbox{text-align:center}
.ringbox .btn{margin-top:12px}
.ring text{font-weight:600;fill:var(--text)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .num{font-size:26px;font-weight:600;margin-top:6px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.mini-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.mini-row:first-child{border-top:0}
.mini-row:hover .nm{color:var(--accent2)}

/* today */
.daybar{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.daybar .ml{flex:1;min-width:260px}
.daybar h2{margin:4px 0 10px}
.daybar .mr{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.today-grid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:16px;align-items:start}
.queue{max-height:calc(100vh - 230px);overflow:auto;position:sticky;top:16px}
.qi-row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.qi-row:hover{background:var(--panel2)}
.qi-row.sel{background:color-mix(in srgb,var(--accent) 14%,var(--panel));box-shadow:inset 3px 0 0 var(--accent)}
.qi-row.done .nm{text-decoration:line-through;color:var(--muted)}
.qn{font-size:11px;color:var(--faint);width:22px;text-align:right;flex:none}
.chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--line2);background:none;display:grid;place-items:center;cursor:pointer;flex:none;color:transparent}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.chk .ic{width:14px;height:14px}
.nm{font-weight:600}
.avatar{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-weight:600;flex:none;color:#fff;
  background:linear-gradient(135deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 50%,#000))}
.avatar.sm{width:30px;height:30px;border-radius:6px;font-size:12px}
.lp-head{display:flex;gap:14px;align-items:flex-start}
.lp-head h3{font-size:20px}
.score{text-align:center}.score small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px}
.tabs button{border:0;background:none;padding:9px 13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.tabbody{display:none;padding-top:14px}.tabbody.on{display:block}
.script{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-height:330px;overflow:auto;font-size:14.5px;line-height:1.6}
.script h4{color:var(--accent2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px}
.script h4:first-child{margin-top:0}
.script p{margin:4px 0}.script ul{margin:4px 0 4px 18px}
.script mark{background:color-mix(in srgb,var(--gold) 25%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.timeline{max-height:330px;overflow:auto}
.tl{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .dot{width:26px;height:26px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;flex:none}
.tl .dot .odot{margin:0}
.tl .txt{white-space:pre-wrap}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.logf{margin-top:16px;padding:16px;border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 8%,var(--bg2)),var(--bg2));border:1px solid var(--line2)}
.outs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:10px 0 12px}
.out input{position:absolute;opacity:0;pointer-events:none}
.out span{display:block;padding:8px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);text-align:center;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--text)}
.out input:checked+span{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.out input:focus-visible+span{outline:2px solid var(--accent2)}
.lf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.lf-row label{margin:0}

/* tables */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px!important;width:100%!important}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.tbl .lk{cursor:pointer;font-weight:600}.tbl .lk:hover{color:var(--accent2)}
.tblwrap{overflow-x:auto}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));border:1px solid var(--accent);margin-bottom:12px}
.bulk select{width:auto}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:var(--muted);font-size:13px}
.sbar{display:inline-block;width:42px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;vertical-align:middle;margin-right:6px}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* dbs */
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:30px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg2)}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.drop .ic{width:34px;height:34px;color:var(--accent);margin-bottom:6px}
.dbcard{position:relative;overflow:hidden}
.dbcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.tbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--panel2);margin:10px 0}
.tbar i{display:block;height:100%}
.maprow{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.maptbl{max-height:46vh;overflow:auto;margin-top:12px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:Inter}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hbar .bar{height:10px}
.kmx th,.kmx td{vertical-align:top}
.kmx td.kc{min-width:200px}
.kmx .kn{font-weight:600}.kmx .kd{font-size:11px;color:var(--muted);margin-top:2px;max-width:220px}
.ks{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;white-space:nowrap}
.ks-good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.ks-ok{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ks-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.ks-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.ks-none{color:var(--faint);background:var(--panel2)}
.kb-good>i{background:var(--good)}.kb-warn>i{background:var(--warn)}.kb-bad>i{background:var(--bad)}.kb-none>i{background:var(--faint)}
.heat td.hc{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.heat th.hc{text-align:right}
.dkpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.dkpis .card{padding:11px 13px}.dkpis .num{font-size:20px;margin-top:2px}.dkpis .lbl{font-size:11px}
/* horizontal scrollbar above the table: flip the scroller, flip the table back */
.scrolltop{transform:scaleY(-1)}.scrolltop>table{transform:scaleY(-1)}
.dbars{max-height:340px;overflow:auto;padding-right:4px}
html,.dbars,.tblwrap,.queue,.modal{scrollbar-color:var(--line2) transparent;scrollbar-width:thin}
.dbar{display:grid;grid-template-columns:minmax(0,170px) 1fr 54px;gap:10px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.dbar:hover{background:var(--panel2)}
.dbar.on{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.dbar .t{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.dbar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dbar b{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.dgrid td,.dgrid th{padding:7px 10px;font-size:12px}
.dgrid th.hc,.dgrid td.hc{text-align:right;white-space:nowrap}
.dgrid thead th{position:sticky;top:0;background:var(--panel);z-index:1}
.funnel .fs{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin:8px 0}
.funnel .fb{height:28px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:700;font-size:13px;min-width:44px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.feed .it{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.feed .it:first-child{border-top:0}

/* misc lists */
.frow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}

const ARTIFICIA_SCRIPT=`# Artificia — B2B AI solutions cold calling script
**Target:** Business owners / directors / plant heads · **Language:** Gujarati + Hinglish
**Objective:** Identify business challenges and book a 15-minute discovery meeting.

# 1. Opening — get permission to speak
**You:** "Hello, {{contactName}} Sir vaat thai rahi chhe?"
**Client:** Haan, bolo.
**You:** "Hu {{myName}} Artificia mathi bolu chhu."
**Client:** Haan, bolo.

# 2. Introduce Artificia — create business relevance
**You:** "Sir, Artificia Vadodara-based AI solutions company chhe. Ame tamara jevi companies sathe kaam kariye chhiye, jema AI ane workflow automation no use kari ne repetitive manual work reduce karva, operational efficiency improve karva ane unnecessary time ane cost bachavva help kariye chhiye."
"Pehla tamari company na existing processes samajiye chhiye, pachhi identify kariye chhiye ke kya AI practically useful thai shake."

# 3. Explain what AI solutions you offer
**Client:** Keva AI solutions?
**You:** "Sir, example tarike, tamari company ma lead follow-ups, customer enquiries, reporting, internal coordination ke repetitive administrative tasks manually thata hoy, to ema thi suitable processes automate kari shakay."
"Amaro approach e chhe ke pehla tamara departments nu audit kariye — sales, marketing, HR ane internal operations — ane pachhi tamari company ni requirements pramane customized AI solutions ane AI agents design kariye."
"Sir, ek quick question puchhu?"

# 4. Discovery question — understand their current system
**You:** "Tamari company ma daily repetitive tasks mostly employees manually handle kare chhe, ke already AI layer use karo cho?"
**If the client says "We are not using AI":**
- "Okay Sir. Etle currently tamari team existing process pramane kaam kare chhe. Ema possible opportunities identify kari shakay."
- "Sir, tamaru sales ane marketing department currently kevi rite handle thay chhe? Leads generate karva, customer follow-ups ane enquiries manage karva mate koi software use karo chho ke mostly manual process chhe?"
**If the client says "We already use AI":**
- "Very good, Sir. To tame already AI taraf step lidho chhe. Ek question — tame AI mainly content ane basic daily tasks mate use karo chho, ke tamara actual business workflows pan automate karya chhe?"
- "Hu etla mate puchhu chhu ke ghani vaar existing tools hova chhata departments vachche manual work baki rahe chhe."

# 5. Identify the business pain point
**You:** "Sir, tamara experience pramane currently sauthi vadhu challenge kya face thay chhe — operations and management, sales and follow-ups, ke repetitive administrative work?"
**Let the client answer. Do not interrupt.** Then respond:
"Samajyu Sir. Etle tamari main concern [repeat the client's problem] chhe. Jo aa process ma suitable AI solution implement kari shakay, to tamari team no manual workload reduce karva ane process ne vadhu efficient banavva scope hoi shake."

# 6. Present the value — connect AI to their problem
**If Sales / Marketing is the problem:**
- "Sir, sales mate AI-powered lead management ane follow-up automation explore kari shakay. Example tarike, lead capture, lead qualification, timely follow-ups ane lead nurturing na suitable steps automate kari shakay."
- "Ena thi tamari team repetitive follow-ups par ochho time spend kari ne qualified prospects ane actual sales conversations par vadhu focus kari shake."
**If Operations / Management is the problem:**
- "Sir, operations ma repetitive reporting, data movement, document processing ane internal workflows identify kari shakay. Je tasks rule-based ane repetitive chhe, ema AI ke workflow automation useful bani shake."
- "Pehla process samajishu, pachhi j decide karishu ke automation practical chhe ke nahi."
**If HR / Administrative work is the problem:**
- "Sir, HR ane internal administration ma document handling, employee queries, information retrieval ane repetitive coordination jeva tasks ma automation opportunities hoi shake. Tamari existing systems sathe su integrate thai shake e pan assess karishu."

# 7. Close for a 15-minute meeting
**You:** "Sir, phone par badhu detail ma explain karvu difficult rehse. Mara suggestion pramane aapde ek 15-minute Zoom meeting kariye."
"Ema ame tamari current process samajishu, possible AI opportunities identify karishu ane relevant hoy to ek practical demo batavishu ke tamari company ma AI kevi rite useful bani shake."
"Sir, tamara mate tomorrow convenient rehse ke day after tomorrow?"
**If the client agrees:** "Perfect Sir. Tamne morning convenient chhe ke afternoon? Hu tamara suitable time pramane meeting schedule karavi dau."
Confirm the **date, time, meeting link**, and the person's **preferred contact method**.

# Objection 1: "I'm busy right now."
**You:** "Sir, tamne kyare call karu — aaje afternoon ke kale morning?"
If appropriate: "Ek quick question Sir — tamari company ma AI implementation currently consider kari rahya chho, ke haju explore nathi karyu?"
If they remain busy, politely end the call and agree on a callback time.

# Objection 2: "We don't need AI."
**You:** "Hu pan nathi kehto ke darek company ne AI ni jarur hoy j."
"Ek relevant question puchhu? Tamari company ma koi repetitive task chhe jema employees no ghano time jato hoy — jem ke reporting, data entry, customer follow-ups ke internal coordination?"
**If they say yes:** "Right Sir. Eva tasks ma AI ke simple workflow automation useful chhe ke nahi e evaluate kari shakay. Jo meaningful benefit na hoy, to implementation karvani pan jarur nathi."
"Etla mate ek short discovery meeting suggest karu chhu, jethi khabar pade ke tamari company mate aa practical chhe ke nahi."

# Objection 3: "We already have an IT team."
**You:** "That's good, Sir. Amaro objective tamari existing IT team ne replace karvano nathi."
"Artificia specialized AI implementation, workflow automation ane customized AI agents ma support provide kare chhe. Tamari IT team existing systems manage karti hoy, to ame temni sathe coordinate kari ne AI opportunities explore kari shakiye."
"Sir, tamari IT team currently AI solutions pan implement kare chhe, ke mainly existing software ane infrastructure manage kare chhe?"
Respond according to their answer. **Do not position Artificia as a replacement for their team.**

# Objection 4: "We're not interested."
**You:** "That's completely fine, Sir. Hu tamne force nathi karva mangto."
"Bas ek last question — tame already tamara repetitive processes automate kari didha chhe, ke currently manual process tamara business mate perfectly work kare chhe?"
If they explain a genuine need, briefly connect it to a relevant solution and ask permission to continue.
If they repeat that they are not interested, thank them and end the call professionally.

# Objection 5: "Send me the details on WhatsApp."
**You:** "Sure Sir, definitely mokli dau. Pan irrelevant information mokalva karta tamari company mate relevant solution share karu to better rehse."
"Ek quick question — tamne mainly sales automation, operational efficiency ke internal process automation ma interest chhe?"
After their response: "Perfect Sir. Hu relevant details share karu chhu. Details joya pachhi 10–15 minute ni short discussion rakhie?"

# Calling rules
- **Ask before pitching further.** Short opening rakho ane permission male pachhi questions puchho.
- **Listen more than you speak.** Client ni actual problem samajva par focus karo.
- **Never guarantee a specific percentage increase.** Results business process, implementation ane adoption par depend kare chhe.
- **Sell the discovery meeting, not the entire solution.** First call no primary objective conversation ane qualified meeting chhe.

  const has=list=>list.find(t=>f.titles.includes(' '+t+' '));
  const role=has(C.econ)?['economic buyer',8]:has(C.champ)?['champion',6]:has(C.tech)?['technical contact',3]:null;
  if(role)part('contact',sh('contact',role[1],15),sh('contact',8,15),1,`Contact is ${role[0]}`);else missing.push('contact title');
  part('contact',f.mobile?sh('contact',7,15):0,sh('contact',7,15),1,f.mobile?'Mobile / WhatsApp available':'No mobile number');
  // 5. tech: ERP (6) + website (4)
  if(f.erp)part('tech',C.erp.some(e=>f.erp.toLowerCase().includes(e))?sh('tech',6,10):0,sh('tech',6,10),1,`ERP: ${f.erp}`);else missing.push('ERP');
  if(f.hasWebField)part('tech',f.web?sh('tech',4,10):0,sh('tech',4,10),1,f.web?'Has a website':'No website');else missing.push('website');
  // 6. intent: 2 points per signal, max 10
  if(f.intent.length)part('intent',Math.min(W.intent,sh('intent',f.intent.length*2,10)),W.intent,1,'Signals: '+f.intent.join(', '));else missing.push('intent signals');
  for(const [k] of ICP_PARTS)parts[k]=parts[k]||{got:0,max:0,notes:[]};
  const earned=Object.values(parts).reduce((a,p)=>a+p.got,0),possible=Object.values(parts).reduce((a,p)=>a+p.max,0);
  const score=Math.min(100,Math.round(P.rescale?earned/Math.max(possible,RESCALE_FLOOR)*100:earned));
  return {score,raw:Math.round(earned),possible:Math.round(possible),parts,est,missing,industry:best?.n||''}}
function icpScore(l){return icpEval(l).score}
const TIERS={A:['Tier A','t-hot','Direct outreach: call + WhatsApp within 48h'],B:['Tier B','t-warm','Nurture sequence + demo offer'],C:['Tier C','t-cold','Hold / do not contact'],X:['Excluded','','Left out of ICP outreach']};
function icpWhy(e){return [e.excluded?'Excluded: '+e.excluded:`${TIERS[e.tier][0]} · ${e.score}/100${S.icpP.rescale?` (${e.raw} of ${e.possible} possible points)`:''}`,
  ...ICP_PARTS.map(([k,n])=>{const p=e.parts[k];return p.max||p.notes.length?`${n}: ${Math.round(p.got)}/${Math.round(p.max)}${p.notes.length?' — '+p.notes.join('; '):''}`:''}).filter(Boolean),
  e.missing.length?'No data for: '+e.missing.join(', '):'',e.recent?`Contacted in the last ${S.icpP.ex.contactedDays} days`:''].filter(Boolean).join('\n')}
// ICP breakdown shown at the top of a lead's Details tab
function icpBox(l){const e=icpEval(l),P=icpP();
  return `<div class="icpbox"><div class="row between wrap gap8"><div><b>ICP: ${e.tier==='X'?'Excluded':TIERS[e.tier][0]}</b> ${tierBadge(e)} <span class="small muted">${e.tier==='X'?esc(e.excluded):`${e.score}/100 · ${TIERS[e.tier][2]}`}</span></div>
    <select data-on="icpEx" data-id="${l.id}" style="width:auto;padding:4px 8px;font-size:12.5px" title="Exclude this company from ICP outreach"><option value="">Not excluded</option>${Object.entries(ICP_EX).map(([k,v])=>`<option value="${k}" ${l.icpEx===k?'selected':''}>${v}</option>`).join('')}</select></div>
    ${ICP_PARTS.map(([k,n])=>{const p=e.parts[k];return `<div class="ip"><span>${n}</span><span class="bar"><i style="width:${p.max?p.got/p.max*100:0}%"></i></span><b class="small" style="text-align:right">${p.max?Math.round(p.got)+'/'+Math.round(p.max):'—'}</b>${p.notes.length?`<small>${esc(p.notes.join(' · '))}</small>`:''}</div>`}).join('')}
    <div class="xs muted mt10">${P.rescale?`Scored on ${e.possible} of 100 points that have data (${e.raw} earned). `:''}${e.missing.length?'No data for: '+esc(e.missing.join(', '))+'. ':''}${e.est.length?'Estimated: '+esc(e.est.join(', '))+'. ':''}${e.recent?`Contacted in the last ${P.ex.contactedDays} days, so kept out of new-outreach lists.`:''}</div></div>`}
const tierBadge=e=>`<span class="tag tier tier-${e.tier}" title="${esc(icpWhy(e))}">${e.tier==='X'?'Excl.':e.tier}</span>`;
const icpCell=e=>`<span style="white-space:nowrap" title="${esc(icpWhy(e))}"><span class="sbar"><i style="width:${e.score}%"></i></span>${e.score} ${tierBadge(e)}</span>`;
function eligible(l){
  if(CLOSED.includes(l.status))return false;
  if(S.icp.requirePhone&&!digits(l.phone))return false;
  if(S.icp.dbs.length&&!S.icp.dbs.includes(l.dbId))return false;
  if(S.icp.cat&&!catsOf(l).includes(S.icp.cat))return false;
  return true;
}
function priority(l){
  const t=today(),e=icpEval(l);let p=e.score;
  if(e.tier==='A'&&!e.recent&&!l.callCount)p+=60; // spec: fresh Tier A leads get called within 48h
  const due=l.nextFollowUp&&l.nextFollowUp<=t;
  if(due)p+=400;
  else if(l.nextFollowUp&&l.nextFollowUp>t)p-=300;
  p+={hot:200,warm:100,cold:0}[l.temp]||0;
  if(!l.callCount)p+=40;
  if(!due&&l.lastCalledAt&&Date.now()-l.lastCalledAt<2*864e5)p-=150;
  return p;
}
function reason(l){
  if(isDue(l))return['Follow-up due','due'];
  if(l.temp==='hot')return['Hot lead','t-hot'];
  if(!l.callCount)return['Fresh','new'];
  const e=icpEval(l);return[e.tier==='X'?'ICP excluded':'ICP '+e.tier+' · '+e.score,'icp'];
}
function calledTodaySet(){const t=today(),s=new Set();for(const e of S.log)if(e.type==='call'&&dkey(e.ts)===t)s.add(e.leadId);return s}
function buildDaily(keep){
  keep=keep.filter(id=>L(id));const ks=new Set(keep),called=calledTodaySet();
  const pool=S.leads.filter(l=>!ks.has(l.id)&&!called.has(l.id)&&eligible(l)).map(l=>[l.id,priority(l)]).sort((a,b)=>b[1]-a[1]);
  const n=Math.max(0,S.settings.dailyTarget-keep.length);
  S.daily={date:today(),ids:keep.concat(pool.slice(0,n).map(x=>x[0]))};save();
}

function rebuildDaily(){const c=calledTodaySet();buildDaily(S.daily.date===today()?S.daily.ids.filter(id=>c.has(id)):[])}

/* stats */
function callsPerDay(){const m={};for(const e of S.log)if(e.type==='call'){const k=dkey(e.ts);m[k]=(m[k]||0)+1}return m}
function todayStats(){const t=today(),r={calls:0,connected:0,notes:0,msgs:0,hot:0,won:0};
  for(const e of S.log){if(dkey(e.ts)!==t)continue;
    if(e.type==='call'){r.calls++;if(OUTCOMES[e.outcome]?.connected)r.connected++;if(e.outcome==='converted')r.won++}
    else if(e.type==='note')r.notes++;else if(e.type==='msg'&&!e.auto)r.msgs++;else if(e.type==='temp'&&e.value==='hot')r.hot++}
  return r}

/* actions on leads */
function logEvent(e){S.log.push({id:uid('e'),ts:Date.now(),...e})}
function logCall(id,{outcome,note,follow}){
  const l=L(id),o=OUTCOMES[outcome],ts=Date.now();
  logEvent({type:'call',leadId:id,outcome,dbId:l.dbId});
  l.callCount=(l.callCount||0)+1;l.lastCalledAt=ts;l.status=o.status;
  if(o.temp&&l.temp!==o.temp){l.temp=o.temp;if(o.temp==='hot')logEvent({type:'temp',leadId:id,value:'hot'})}
  note=String(note||'').trim();
  l.notes.push({id:uid('n'),ts,text:note,outcome});
  if(note)logEvent({type:'note',leadId:id});
  l.nextFollowUp=['converted','not_interested','wrong'].includes(outcome)?'':(follow||'');
  save();
}
function addNote(id,text){const l=L(id);text=String(text||'').trim();if(!text)return toast('Write a note first','bad');
  l.notes.push({id:uid('n'),ts:Date.now(),text,outcome:'note'});logEvent({type:'note',leadId:id});save();}
function setTemp(id,t){const l=L(id);if(!l||l.temp===t)return;l.temp=t;if(t==='hot')logEvent({type:'temp',leadId:id,value:'hot'});save();}

function sendTpl(id,tplId){
  const l=L(id),t=S.templates.find(x=>x.id===tplId);if(!l||!t)return;
  const body=fill(t.body,l),subj=fill(t.subject,l);let href;
  if(t.channel==='whatsapp'){const p=waPhone(l.phone);if(!p)return toast('This lead has no valid phone number','bad');href='https://wa.me/'+p+'?text='+encodeURIComponent(body)}
  else{if(!l.email)return toast('This lead has no email address','bad');href='mailto:'+l.email+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body)}
  openLink(href,t.channel==='whatsapp');
  logEvent({type:'msg',leadId:id,channel:t.channel,tplId});
  l.notes.push({id:uid('n'),ts:Date.now(),text:`${t.channel==='whatsapp'?'WhatsApp':'Email'} sent: “${t.name}”`,outcome:'msg'});
  save();
  if(S.campaign&&S.campaign.ids.includes(id)&&!S.campaign.sent.includes(id)&&S.campaign.tplId===tplId){S.campaign.sent.push(id);save()}
}

const uniqI=a=>{const s=new Set();return a.map(v=>String(v??'').trim()).filter(v=>{const k=v.toLowerCase();if(!v||k==='null'||s.has(k))return false;s.add(k);return true})};

const joinAddr=(...p)=>uniqI(p.flat().map(x=>String(x??'').replace(/\s+/g,' ').replace(/^[\s,]+|[\s,]+$/g,''))).join(', ');
// VCCI 2024 record as a company profile: Products · Categories · Memberships · Factory / Office · other fields · ad page
function vcciDetails(r,l){
  const used=new Set(['AdImage','CompanyName','AdvertiserCode','Location','Products','ProductCategories','MemberOf']);
  const block=(p,always)=>{['Address','ContactPerson','STD','Phone','Mobile','Email','Website','PIN','State','City'].forEach(k=>used.add(p+k));
    const g=k=>String(r[p+k]??'').trim(),std=g('STD'),cps=contactsOf([g('ContactPerson')]);
    const has=always||['Address','ContactPerson','Phone','Mobile','Email','Website'].some(k=>g(k));if(!has)return [];
    return [[p,[
      ['Address',[joinAddr(g('Address'),g('City'),g('State')),g('PIN')].filter(Boolean).join(' - ')],
      [cps.length>1?`Contact persons (${cps.length})`:'Contact person',cps.join('\n'),'',1],
      ['Phone',g('Phone')?(std?(std==='+91'?'(+91) ':std+' '):'')+g('Phone'):''],
      ['Mobile',g('Mobile')],['Email',g('Email'),'mail',1],['Website',g('Website'),'web',1]]]]};
  const blocks=[...block('Factory',!['Address','ContactPerson','Phone','Mobile','Email','Website'].some(k=>String(r['Office'+k]??'').trim())),...block('Office',false)];
  const lab=k=>k.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\s+/g,' ').trim();
  return bizCard({sub:[r.AdvertiserCode&&'Advertiser code '+r.AdvertiserCode,r.Location].filter(Boolean).join(' · '),
    products:r.Products,cats:String(r.ProductCategories||'').split(/\s*;\s*/),members:String(r.MemberOf||'').split(/\s*[,;]\s*/),blocks,
    other:Object.keys(r).filter(k=>k[0]!=='_'&&!used.has(k)).map(k=>[lab(k),r[k]]),
    last:l.lastCalledAt?fmtWhen(l.lastCalledAt):'never',
    foot:r.AdImage?`<div class="biz-sec"><div class="biz-h">Scanned ad page</div><a href="${esc(VCCI_BASE+r.AdImage)}" target="_blank"><img src="${esc(VCCI_BASE+r.AdImage)}" alt="Ad for ${esc(r.CompanyName||'')}" loading="lazy" style="width:100%;border-radius:10px;border:1px solid var(--line)"></a></div>`:''});
}

// "Mr  Urmit Shah,MR Amit Shah,Mr  Urmit Shah" → ["Mr Urmit Shah","Mr Amit Shah"]; also splits on ; / & and "and"
function contactsOf(cells){const out=[],seen=new Set();
  // split on , ; / & and "and" — but not inside brackets, e.g. "(MD & CEO)" or "(Manager - R & D)"
  const split=s=>{const parts=[];let cur='',d=0;for(let i=0;i<s.length;i++){const ch=s[i];
    if(ch==='(')d++;else if(ch===')')d=Math.max(0,d-1);
    if(!d&&/[,;\/&]/.test(ch)){parts.push(cur);cur='';continue}
    if(!d&&/^\s+and\s+/i.test(s.slice(i))&&/\S$/.test(cur)){const m=s.slice(i).match(/^\s+and\s+/i)[0];parts.push(cur);cur='';i+=m.length-1;continue}
    cur+=ch}parts.push(cur);return parts};
  for(const c of cells)for(let p of split(String(c??''))){
    p=p.replace(/\s+/g,' ').trim().replace(/^(mr|mrs|ms|dr|miss)\b\.?/i,m=>m[0].toUpperCase()+m.slice(1).toLowerCase());
    const key=p.toLowerCase().replace(/^(mr|mrs|ms|dr|miss)\b\.?\s*/,'').replace(/[^a-z]/g,'');
    if(key.length<2||key==='null'||seen.has(key))continue;seen.add(key);out.push(p)}
  return out}

function renderScript(t){
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[(.+?)\]/g,'<mark>[$1]</mark>');
  let h='',inList=false;
  for(const line of t.split('\n')){const s=line.trim();
    if(s.startsWith('- ')||s.startsWith('• ')){if(!inList){h+='<ul>';inList=true}h+='<li>'+inline(s.slice(2))+'</li>';continue}
    if(inList){h+='</ul>';inList=false}
    if(s.startsWith('#'))h+='<h4>'+inline(s.replace(/^#+\s*/,''))+'</h4>';else if(s)h+='<p>'+inline(s)+'</p>'}
  return h+(inList?'</ul>':'')}

const RAWBLOB=new Map();
function blobOf(l){const r=rawOf(l);let rb='';if(r){rb=RAWBLOB.get(l.vcci);if(rb===undefined){rb=norm(Object.values(r).join(' '));RAWBLOB.set(l.vcci,rb)}}
  return norm([l.name,l.company,l.contact,l.phone,l.email,l.city,l.industry].join(' '))+' '+rb}

function filteredLeads(){
  const q=norm(LF.q),c=calledTodaySet(),vc=isVcciView(),st=vc?'all':LF.status,cl=vc?'all':LF.called;
  let r=S.leads.filter(l=>(LF.db==='all'||l.dbId===LF.db)&&(LF.temp==='all'||l.temp===LF.temp)
    &&(st==='all'||(st==='open'?!CLOSED.includes(l.status):l.status===st))
    &&(cl==='all'||(cl==='today'?c.has(l.id):cl==='nottoday'?!c.has(l.id):cl==='never'?!l.callCount:isDue(l)))
    &&(!LF.cat||catsOf(l).includes(LF.cat))
    &&(!LF.tier||tierOk(LF.tier,icpEval(l).tier))
    &&(!q||blobOf(l).includes(q)));
  const P=new Map(r.map(l=>[l.id,priority(l)]));
  r.sort(LF.sort==='name'?(a,b)=>String(a.name).localeCompare(b.name):LF.sort==='recent'?(a,b)=>(b.lastCalledAt||0)-(a.lastCalledAt||0):LF.sort==='added'?(a,b)=>(b.createdAt||0)-(a.createdAt||0):(a,b)=>P.get(b.id)-P.get(a.id));
  return r;
}

// Tier counts for every database: saved leads per database, plus every row of each loaded directory
function icpCounts(){const rows=[];
  for(const d of S.dbs){
    if(d.dir&&DIRS[d.dir]){const k=d.dir,D=DIR[k];if(!D){rows.push({d,k,loaded:false});continue}
      const lm=dirLeadMap(k),c={A:0,B:0,C:0,X:0,fresh:0};for(let i=0;i<D.r.length;i++){const e=icpDir(k,i,lm);c[e.tier]++;if(e.tier==='A'&&!e.recent&&!lm.get(i)?.callCount)c.fresh++}
      rows.push({d,k,loaded:true,n:D.r.length,...c})}
    else{const ls=S.leads.filter(l=>l.dbId===d.id),c={A:0,B:0,C:0,X:0,fresh:0};for(const l of ls){const e=icpEval(l);c[e.tier]++;if(e.tier==='A'&&!e.recent&&!l.callCount)c.fresh++}rows.push({d,loaded:true,n:ls.length,...c})}}
  return rows}

const fmtHour=h=>(h%12||12)+(h<12?' AM':' PM');
function stackBars(days,per){
  const W=720,H=220,pb=24,pt=12,tg=S.settings.dailyTarget,vals=days.map(d=>per[d].c+per[d].n),max=Math.max(10,...vals,Math.min(tg,Math.max(...vals)*1.6||tg));
  const bw=W/days.length,sc=v=>v/max*(H-pb-pt);let s='';
  days.forEach((d,i)=>{const x=i*bw+bw*.17,w=bw*.66,hn=sc(per[d].n),hc=sc(per[d].c),y=H-pb,tot=per[d].c+per[d].n;
    s+=`<g><title>${fmtDay(d)}: ${tot} calls (${per[d].c} connected)</title><rect x="${x}" y="${y-hn}" width="${w}" height="${hn}" fill="var(--muted)" opacity=".35" rx="2"/><rect x="${x}" y="${y-hn-hc}" width="${w}" height="${hc}" fill="var(--accent)" rx="2"/></g>`;
    if(days.length<=14||i%Math.ceil(days.length/12)===0)s+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${+d.slice(8)}/${+d.slice(5,7)}</text>`});
  if(tg<=max){const y=H-pb-sc(tg);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--gold)" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W-4}" y="${Math.max(12,y-5)}" text-anchor="end" style="fill:var(--gold)">target ${tg}</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/></svg>`;
}
function hourChart(hrs){const hs=[...Array(13)].map((_,i)=>i+8),W=300,H=120,pb=18,max=Math.max(1,...hs.map(h=>hrs[h]?.t||0)),bw=W/hs.length;let s='';
  hs.forEach((h,i)=>{const v=hrs[h]||{t:0,c:0},hh=v.t/max*(H-pb-6),rate=v.t?v.c/v.t:0;
    s+=`<rect x="${i*bw+bw*.15}" y="${H-pb-hh}" width="${bw*.7}" height="${hh}" rx="2" fill="var(--accent2)" opacity="${.3+rate*.7}"><title>${fmtHour(h)}: ${v.t} calls, ${Math.round(rate*100)}% connected</title></rect>`;
    if(i%2===0)s+=`<text x="${i*bw+bw/2}" y="${H-4}" text-anchor="middle" style="font-size:9px">${h%12||12}${h<12?'a':'p'}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg><div class="xs muted">Bar height = calls · brighter = more of them connect</div>`}

/* ---------- KPIs & targets ---------- */
const KPIS=[
  {k:'calls',n:'Calls made',kind:'count',d:'Every call logged, any outcome'},
  {k:'reached',n:'Unique leads called',kind:'count',d:'Different leads dialled'},
  {k:'connected',n:'Conversations',kind:'count',d:'Calls where you spoke to someone'},
  {k:'connRate',n:'Connect rate',kind:'rate',d:'Conversations ÷ calls',base:'calls',min:10},
  {k:'interested',n:'Interested leads',kind:'count',d:'Calls logged as Interested'},
  {k:'won',n:'Conversions',kind:'count',d:'Calls logged as Converted'},
  {k:'winRate',n:'Conversion rate',kind:'rate',d:'Conversions ÷ conversations',base:'connected',min:5},
  {k:'msgs',n:'Follow-ups sent',kind:'count',d:'WhatsApp and email, manual and automated'},
  {k:'notes',n:'Call notes written',kind:'count',d:'Notes saved on calls or leads'},
];
// default daily targets as a share of daily calls (rates are percentages)
const KPI_DEF={reached:.9,connected:.25,connRate:25,interested:.03,won:.01,winRate:5,msgs:.15,notes:.25};
function ensureTargets(){
  if(S.targets&&S.targets.v===1)return S.targets;
  const c=S.settings.dailyTarget||100,wd=6,t={v:1,workDays:wd};
  for(const K of KPIS){if(K.kind==='rate'){t[K.k]={r:KPI_DEF[K.k]};continue}
    const d=K.k==='calls'?c:Math.max(1,Math.round(c*KPI_DEF[K.k]));t[K.k]={d,w:d*wd,m:Math.round(d*wd*52/12)}}
  return S.targets=t}
function tget(k,p){const t=ensureTargets()[k];if(!t)return 0;if('r' in t)return t.r;if(k==='calls'&&p==='d')return S.settings.dailyTarget;return t[p]||0}
const isWorkDay=d=>(d.getDay()+6)%7<ensureTargets().workDays;
function workDaysIn(a,b){let n=0;const d=new Date(a);while(d<b){if(isWorkDay(d))n++;d.setDate(d.getDate()+1)}return n}
function periodRange(p,ref=new Date()){
  const s=new Date(ref);s.setHours(0,0,0,0);
  if(p==='w')s.setDate(s.getDate()-((s.getDay()+6)%7));
  if(p==='m')s.setDate(1);
  const e=new Date(s);if(p==='d')e.setDate(e.getDate()+1);else if(p==='w')e.setDate(e.getDate()+7);else e.setMonth(e.getMonth()+1);
  return[s,e]}
// share of the period's working time already gone (working day counted as 9:00–18:00)
function periodInfo(p){
  const [a,b]=periodRange(p),now=new Date(),t0=new Date(now);t0.setHours(0,0,0,0);
  const dayF=Math.max(0,Math.min(1,(now.getHours()+now.getMinutes()/60-9)/9));
  if(p==='d')return{a,b,frac:isWorkDay(t0)?dayF:1,label:t0.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})+(isWorkDay(t0)?'':' · non-working day')};
  const total=workDaysIn(a,b),before=workDaysIn(a,t0),wt=isWorkDay(t0);
  const frac=total?Math.min(1,(before+(wt?dayF:0))/total):1,nth=before+(wt?1:0);
  const fd=d=>d.toLocaleDateString([],{day:'numeric',month:'short'}),last=new Date(b);last.setDate(last.getDate()-1);
  return{a,b,frac,label:(p==='w'?`${fd(a)} – ${fd(last)}`:a.toLocaleDateString([],{month:'long',year:'numeric'}))+` · working day ${nth} of ${total}`}}
function kpiActuals(from,to){
  from=+from;to=+to;const r={calls:0,connected:0,interested:0,won:0,msgs:0,notes:0},seen=new Set();
  for(const e of S.log){if(e.ts<from||e.ts>=to)continue;
    if(e.type==='call'){r.calls++;seen.add(e.leadId);if(OUTCOMES[e.outcome]?.connected)r.connected++;if(e.outcome==='interested')r.interested++;if(e.outcome==='converted')r.won++}
    else if(e.type==='msg')r.msgs++;else if(e.type==='note')r.notes++}
  r.reached=seen.size;r.connRate=r.calls?r.connected/r.calls*100:null;r.winRate=r.connected?r.won/r.connected*100:null;return r}
// → [label, class, attainment 0..n]
function kpiStatus(K,act,tg,frac,base){
  if(!tg)return['No target','none',null];
  if(K.kind==='rate'){if(act==null||base<K.min)return['Too few calls','none',null];const a=act/tg;return a>=1?['Achieved','good',a]:a>=.8?['Close','warn',a]:['Below','bad',a]}
  const a=act/tg;if(a>=1)return['Achieved','good',a];
  const exp=tg*frac;return act>=exp*.9?['On track','ok',a]:act>=exp*.6?['Behind','warn',a]:['Off track','bad',a]}
const fmtK=(K,v)=>v==null?'—':K.kind==='rate'?(v<10&&v%1?v.toFixed(1):Math.round(v))+'%':fmtN(v);
function vKpi(){
  ensureTargets();
  const P=[['d','Today'],['w','This week'],['m','This month']].map(([p,n])=>{const i=periodInfo(p);return{p,n,...i,act:kpiActuals(i.a,i.b)}});
  const cellData=(K,X)=>{const v=X.act[K.k],tg=tget(K.k,X.p);return[v,tg,...kpiStatus(K,v,tg,X.frac,X.act[K.base])]};
  const summary=X=>{let ok=0,n=0,sum=0;KPIS.forEach(K=>{const [, ,, sc,a]=cellData(K,X);if(sc==='none')return;n++;if(sc==='good'||sc==='ok')ok++;sum+=Math.min(1,a)});return{ok,n,score:n?Math.round(sum/n*100):0}};
  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);const [a,b]=periodRange('m',d),cur=i===5;
    return{a,b,cur,name:a.toLocaleDateString([],{month:'short',year:'2-digit'}),frac:cur?periodInfo('m').frac:1,act:kpiActuals(a,b)}});
  return `<div class="row between wrap gap8" style="margin-bottom:14px">
      <div class="legend"><span><i style="background:var(--good)"></i>Achieved</span><span><i style="background:var(--accent)"></i>On track</span><span><i style="background:var(--warn)"></i>Behind / close</span><span><i style="background:var(--bad)"></i>Off track / below</span></div>
      <button class="btn sm primary" data-act="editTargets">${ico('edit')} Edit targets</button></div>
    <div class="grid3">${P.map(X=>{const s=summary(X);return `<div class="card kpi"><div class="lbl">${X.n}</div><div class="num">${s.score}%</div>
      <div class="bar mt6"><i style="width:${s.score}%"></i></div><div class="sub">average target attainment · ${s.ok} of ${s.n} KPIs achieved or on track</div><div class="xs faint mt6">${esc(X.label)}</div></div>`}).join('')}</div>
    <div class="card pad0 mt16"><div class="ch" style="padding:16px 18px 0"><h3>KPI matrix</h3><span class="xs muted">Actual / target · status compares progress with time elapsed (working day 9:00–18:00, ${ensureTargets().workDays} working days a week)</span></div>
      <div class="tblwrap"><table class="tbl kmx"><thead><tr><th>KPI</th>${P.map(X=>`<th>${X.n}<div class="xs faint" style="text-transform:none;letter-spacing:0;font-weight:500">${Math.round(X.frac*100)}% of period elapsed</div></th>`).join('')}</tr></thead><tbody>
      ${KPIS.map(K=>`<tr><td><div class="kn">${K.n}</div><div class="kd">${K.d}</div></td>${P.map(X=>{const [v,tg,sl,sc,a]=cellData(K,X);
        return `<td class="kc"><div class="row between gap8"><span><b class="num">${fmtK(K,v)}</b> <span class="muted small">/ ${fmtK(K,tg)}</span></span><span class="ks ks-${sc}">${sl}</span></div>
          <div class="bar mt6 kb-${sc}"><i style="width:${a==null?0:Math.min(100,a*100)}%"></i></div>
          <div class="xs muted mt6">${a==null?'&nbsp;':Math.round(a*100)+'% of target'}${K.kind==='count'&&tg&&sc!=='good'?` · expected by now ${fmtN(Math.round(tg*X.frac))}`:''}</div></td>`}).join('')}</tr>`).join('')}
      </tbody></table></div></div>
    <div class="card pad0 mt16"><div class="ch" style="padding:16px 18px 0"><h3>Monthly trend</h3><span class="xs muted">Actuals per month, shaded by attainment of the monthly target (current month pro-rated)</span></div>
      <div class="tblwrap"><table class="tbl heat"><thead><tr><th>KPI</th>${months.map(M=>`<th class="hc">${esc(M.name)}${M.cur?' <span class="faint">(MTD)</span>':''}</th>`).join('')}<th class="hc">Monthly target</th></tr></thead><tbody>
      ${KPIS.map(K=>{const tg=tget(K.k,'m');return `<tr><td class="kn">${K.n}</td>${months.map(M=>{const v=M.act[K.k];let bg='';
          if(tg&&v!=null&&!(K.kind==='rate'&&M.act[K.base]<K.min)){const a=K.kind==='rate'?v/tg:v/Math.max(1e-9,tg*M.frac);const c=a>=1?'good':a>=.8?'warn':'bad';bg=`background:color-mix(in srgb,var(--${c}) 14%,transparent)`}
          return `<td class="hc" style="${bg}">${fmtK(K,v)}</td>`}).join('')}<td class="hc muted">${fmtK(K,tg)}</td></tr>`}).join('')}
      </tbody></table></div></div>`;
}

const FGUESS=[['email',/e-?mail/i],['phone',/phone|mobile|mob\b|contact\s*(no|num)|number|whats\s*app|cell|tel/i],['company',/company|business|firm|organi[sz]ation|shop|store|brand|agency/i],

function doImport(){
  const {head,body,map}=IMP;
  if(!['name','phone','company'].some(f=>map.includes(f)))return toast('Match at least a Name, Phone or Company column','bad');
  let dbId=$('#impDb').value;
  if(dbId==='__new')dbId=newDb($('#impName').value.trim()||'Imported list').id;
  const dedupe=$('#impDedupe').checked,defT=$('#impTemp').value,seen=new Set(),ts=Date.now();
  if(dedupe)S.leads.filter(l=>l.dbId===dbId).forEach(l=>{if(digits(l.phone))seen.add('p'+digits(l.phone).slice(-10));if(l.email)seen.add('e'+norm(l.email))});
  let added=0,dup=0,skipped=0;
  for(const r of body){const l=blankLead(dbId);l.temp=defT;
    head.forEach((h,i)=>{const v=String(r[i]??'').trim();if(!v)return;const f=map[i];
      if(!f)l.extra[h]=v;else if(f==='temp')l.temp=parseTemp(v)||defT;else if(f==='notes')l.notes.push({id:uid('n'),ts,text:v,outcome:'import'});else l[f]=l[f]?l[f]+' '+v:v});

  go('leads',{db:dbId});
}

    if(API.on)await api('enroll/stop',{method:'POST',body:{seqId:id}}).catch(()=>{});S.sequences=S.sequences.filter(s=>s.id!==id);save();render()},
  enrollSeg:a=>segmentForm(`Add leads to “${esc(seqName(a.dataset.id))}”`,'enrollSeg',a.dataset.id),
  stopEnroll:async a=>{try{await api('enroll/stop',{method:'POST',body:{ids:[+a.dataset.eid]}});toast('Sequence stopped for this lead','good');await poll();refresh()}catch(e){toast(e.message,'bad')}},
  testEmail:async a=>{const to=$('#testEmailTo').value.trim();a.disabled=true;
    try{await api('test',{method:'POST',body:{channel:'email',to}});toast('Test email sent to '+to,'good',4000)}catch(e){toast(''+e.message,'bad',8000)}a.disabled=false},
  testWa:async a=>{const to=$('#testWaTo').value.trim();a.disabled=true;
    try{await synced();await api('test',{method:'POST',body:{channel:'whatsapp',to}});toast('Test WhatsApp sent to '+to,'good',4000)}catch(e){toast(''+e.message,'bad',8000)}a.disabled=false},
  /* icp */
  icpAdd:a=>{const k=a.dataset.k;S.icp[k].push(a.dataset.v);save();render()},
  /* admin */
  range:a=>{UI.range=+a.dataset.n;render()},
  editTargets:()=>targetForm(),
  tgtDerive:a=>{const f=a.closest('form'),wd=+f.elements.workDays.value;
    KPIS.filter(K=>K.kind==='count').forEach(K=>{const d=+f.elements[K.k+'.d'].value||0;f.elements[K.k+'.w'].value=d*wd;f.elements[K.k+'.m'].value=Math.round(d*wd*52/12)});
    toast('Weekly and monthly targets filled from the daily ones. Save to keep them.')},
  /* settings */
  backup:()=>download('salesquest-backup-'+today()+'.json',JSON.stringify(S),'application/json'),
  restore:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());
    if(!Array.isArray(d.leads))throw new Error('not a SalesQuest backup');if(!confirm(`Replace ALL current data with this backup (${d.leads.length} leads)?`))return;
    S=hydrate(d);save();toast('Backup restored','good');render()}catch(e){toast('Invalid backup file: '+e.message,'bad')}};i.click()},
  reset:()=>{if(!confirm('Erase ALL leads, databases, history and settings? Export a backup first if you might need it.'))return;if(prompt('Type ERASE to confirm')!=='ERASE')return;
    S=defaults();LMAP=null;save();render();toast('Everything erased')},
};
const ON={
  todaySrc:t=>{S.icp.dbs=t.value==='all'?[]:[t.value];rebuildDaily();UI.sel=null;render()},
  callCat:t=>{S.icp.cat=t.value;rebuildDaily();UI.sel=null;UI.todayFilter='pending';toast(t.value?`Today's list: only “${t.value}”`:"Today's list: all categories",'good');render()},
  setScript:t=>{S.settings.activeScript=t.value;save();refresh()},
  icpEx:t=>{const l=L(t.dataset.id);if(!l)return;if(t.value)l.icpEx=t.value;else delete l.icpEx;save();refresh();if(UI.view==='leads')renderLeadsTable()},
  // ICP builder: data-p is the path inside S.icpP, data-t the value type
  icpSet:t=>{const P=icpP(),path=t.dataset.p.split('.'),ty=t.dataset.t;
    const v=ty==='bool'?t.checked:ty==='num'?Math.max(0,+t.value||0):ty==='list'?t.value.split(',').map(s=>s.trim()).filter(Boolean):t.value;
    let o=P;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=v;icpTouch();save();render()},
  icpEnt:t=>{const P=icpP(),s=new Set(P.hard.entities);t.checked?s.add(t.value):s.delete(t.value);P.hard.entities=[...s];icpTouch();save();render()},
  lf:t=>{LF[t.dataset.k]=t.value;LF.page=0;if(t.dataset.k==='db')try{localStorage.setItem(KEY+'.db',t.value)}catch(e){}if(t.dataset.k==='db'||t.dataset.k==='cat')render();else renderLeadsTable()},
  df:t=>{DF[t.dataset.k]=t.value;DF.page=0;renderDirTable()},
  dirSel:t=>{t.checked?DF.sel.add(+t.value):DF.sel.delete(+t.value);renderDirTable()},
  dirSelAll:t=>{$$('input[data-on=dirSel]').forEach(c=>{t.checked?DF.sel.add(+c.value):DF.sel.delete(+c.value)});renderDirTable()},
  selLead:t=>{t.checked?LF.sel.add(t.value):LF.sel.delete(t.value);renderBulk()},
  selAll:t=>{$$('input[data-on=selLead]').forEach(c=>{c.checked=t.checked;t.checked?LF.sel.add(c.value):LF.sel.delete(c.value)});renderBulk()},
  bulkMove:t=>{if(!t.value)return;LF.sel.forEach(id=>{L(id).dbId=t.value});save();toast(`${LF.sel.size} leads moved`,'good');LF.sel.clear();render()},
  mapcol:t=>{IMP.map[+t.dataset.i]=t.value},
  impDb:t=>{$('#impNameWrap').style.display=t.value==='__new'?'':'none'},
  rule:t=>{S.rules[t.dataset.k]=t.value;save();toast('Saved','good',1200)},
  bulkEnroll:t=>{if(!t.value)return;const ids=[...LF.sel];LF.sel.clear();enroll(t.value,ids)},
  enrollOne:t=>{if(t.value)enroll(t.value,[t.dataset.id])},
  icpList:t=>{S.icp[t.dataset.k]=t.value.split(',').map(s=>s.trim()).filter(Boolean);save();render()},
  icpW:t=>{S.icp.w[t.dataset.k]=+t.value;save();render()},
  icpPhone:t=>{S.icp.requirePhone=t.checked;save();render()},
  icpDb:t=>{const all=S.dbs.map(d=>d.id);let cur=S.icp.dbs.length?[...S.icp.dbs]:[...all];
    cur=t.checked?[...new Set([...cur,t.value])]:cur.filter(x=>x!==t.value);S.icp.dbs=cur.length===all.length?[]:cur;
    if(!cur.length){S.icp.dbs=[];toast('At least one database is needed. Using all of them.')}save();render()},
  setting:t=>{const v=Math.max(1,Math.min(1000,+t.value||100));S.settings[t.dataset.k]=v;save();topUpDaily();render()},
};
const FORMS={
  log:(f,fd)=>{
    const id=f.dataset.id,outcome=fd.get('outcome');if(!outcome)return toast('Pick how the call went first','bad');
    const tpl=fd.get('tpl'),mode=f.dataset.mode;
    if(mode==='today'){const done=calledTodaySet(),ids=S.daily.ids.filter(x=>L(x)&&!done.has(x)&&x!==id),idx=S.daily.ids.indexOf(id);
      UI.sel=ids.find(x=>S.daily.ids.indexOf(x)>idx)||ids[0]||null}
    logCall(id,{outcome,note:fd.get('note'),follow:fd.get('follow')});
    f.reset();
    if(mode!=='today')closeModal();
    if(tpl)sendTpl(id,tpl);
    render();
  },
  lead:(f,fd)=>{
    const id=f.dataset.id,d=Object.fromEntries(fd);
    if(!d.name.trim()&&!d.phone.trim())return toast('Add at least a name or phone','bad');
    let l=id&&L(id);
    if(d.dbId==='__new'){d.dbId=newDb(d.newDb?.trim()||'My leads').id}
    if(!l){l=blankLead(d.dbId);S.leads.push(l)}
    ['name','phone','email','company','city','industry','size','source','temp','status','dbId','nextFollowUp'].forEach(k=>{if(d[k]!==undefined)l[k]=String(d[k]).trim()});
    save();closeModal();topUpDaily();toast(id?'Lead updated':'Lead added','good');render();
  },
  tpl:(f,fd)=>{const id=f.dataset.id,d=Object.fromEntries(fd);let t=id&&S.templates.find(x=>x.id===id);
    if(!t){t={id:uid('t')};S.templates.push(t)}Object.assign(t,{name:d.name.trim(),channel:d.channel,subject:d.subject||'',body:d.body,
      metaName:(d.metaName||'').trim(),metaLang:(d.metaLang||'en').trim(),metaParams:(d.metaParams||'').trim()});save();closeModal();render();toast('Template saved','good')},
  seq:(f,fd)=>{const id=f.dataset.id,steps=[];
    for(let i=0;i<6;i++){const t=fd.get('tpl'+i);if(t)steps.push({day:Math.max(0,+fd.get('day'+i)||0),tplId:t})}
    if(!steps.length)return toast('Add at least one step with a template','bad');
    steps.sort((a,b)=>a.day-b.day);
    let s=id&&S.sequences.find(x=>x.id===id);if(!s){s={id:uid('q'),active:true};S.sequences.push(s)}
    Object.assign(s,{name:fd.get('name').trim()||'Sequence',steps,stopOn:fd.getAll('stopOn')});save();closeModal();render();toast('Sequence saved','good')},
  enrollSeg:(f,fd)=>{const d=Object.fromEntries(fd),sq=S.sequences.find(s=>s.id===f.dataset.id);
    const chs=new Set(sq.steps.map(s=>S.templates.find(t=>t.id===s.tplId)?.channel).filter(Boolean));
    closeModal();enroll(sq.id,segmentLeads(d,chs.size===1?[...chs][0]:'any').map(l=>l.id))},
  cfg:async(f,fd)=>{
    const g={wa:{},email:{},limits:{days:fd.getAll('limits.days').map(Number)},reminder:{enabled:fd.has('reminder.enabled')}};
    for(const [k,v] of fd){const [a,b]=k.split('.');if(!b||b==='days'||b==='enabled')continue;g[a][b]=v}
    ['waPerDay','emailPerDay','gapSec'].forEach(k=>g.limits[k]=Math.max(0,+g.limits[k]||0));g.email.port=+g.email.port||465;
    g.optOut=String(fd.get('optOut')||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
    try{API.cfg=await api('config',{method:'PUT',body:g});await poll();toast('Backend settings saved','good');render()}catch(e){toast('Could not save: '+e.message,'bad',5000)}},
  script:(f,fd)=>{const s=S.scripts.find(x=>x.id===f.dataset.id);s.name=fd.get('name').trim()||'Script';s.body=fd.get('body');save();render();toast('Script saved','good')},
  targets:(f,fd)=>{const t=ensureTargets(),num=k=>Math.max(0,+fd.get(k)||0);t.workDays=Math.max(1,Math.min(7,+fd.get('workDays')||6));
    for(const K of KPIS){if(K.kind==='rate'){t[K.k]={r:Math.min(100,num(K.k+'.r'))};continue}
      t[K.k]={d:num(K.k+'.d'),w:num(K.k+'.w'),m:num(K.k+'.m')}}
    S.settings.dailyTarget=Math.max(1,Math.min(1000,t.calls.d||100));t.calls.d=S.settings.dailyTarget;
    save();topUpDaily();closeModal();render();toast('Targets saved','good')},
  settings:(f,fd)=>{const d=Object.fromEntries(fd);Object.assign(S.settings,{myName:d.myName.trim(),myCompany:d.myCompany.trim(),cc:digits(d.cc)||'91',theme:d.theme,
    dailyTarget:Math.max(1,Math.min(1000,+d.dailyTarget||100))});save();topUpDaily();render();toast('Settings saved','good')},
  campaign:(f,fd)=>{const d=Object.fromEntries(fd),t=S.templates.find(x=>x.id===d.tpl);
    const ids=S.leads.filter(l=>(d.db==='all'||l.dbId===d.db)&&(d.temp==='all'||l.temp===d.temp)&&(d.status==='open'?!CLOSED.includes(l.status):l.status===d.status)&&(!d.cat||catsOf(l).includes(d.cat))
      &&(t.channel==='whatsapp'?waPhone(l.phone):l.email)).sort((a,b)=>priority(b)-priority(a)).slice(0,+d.max||50).map(l=>l.id);
    if(!ids.length)return toast('No leads match that segment (with a '+(t.channel==='whatsapp'?'phone':'email')+')','bad');
    S.campaign={tplId:t.id,ids,sent:[]};save();render();toast(`Campaign ready: ${ids.length} leads`,'good')},
};
function refresh(){render();refreshDrawer()}
function refreshDrawer(){const m=$('#modal-root .modal.drawer');if(UI.drawer&&m&&L(UI.drawer)){const d=captureDrafts();m.innerHTML=drawerHTML(L(UI.drawer));restoreDrafts(d)}}
function leadForm(l){
  const n=!l;l=l||{...blankLead(LF.db!=='all'?LF.db:(S.dbs[0]?.id||'__new'))};
  openModal(`<div class="mh"><h3>${n?'Add lead':'Edit lead'}</h3><button class="btn icon ghost" data-act="closeModal">${ico('x')}</button></div>
    <form data-form="lead" data-id="${n?'':l.id}" class="fgrid">
      <label>Name<input name="name" value="${esc(l.name)}"></label><label>Phone<input name="phone" value="${esc(l.phone)}"></label>
      <label>Email<input name="email" type="email" value="${esc(l.email)}"></label><label>Company<input name="company" value="${esc(l.company)}"></label>
      <label>City / area<input name="city" value="${esc(l.city)}"></label><label>Industry<input name="industry" value="${esc(l.industry)}"></label>
      <label>Company size<input name="size" value="${esc(l.size)}"></label><label>Source<input name="source" value="${esc(l.source)}"></label>
      <label>Temperature<select name="temp">${Object.entries(TEMPS).map(([k,v])=>`<option value="${k}" ${l.temp===k?'selected':''}>${v.icon} ${v.label}</option>`).join('')}</select></label>
      <label>Status<select name="status">${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}" ${l.status===k?'selected':''}>${v}</option>`).join('')}</select></label>
      <label>Database<select name="dbId" onchange="this.form.newDb.parentElement.style.display=this.value==='__new'?'':'none'">${dbOptions(l.dbId)}<option value="__new" ${S.dbs.length?'':'selected'}>+ New database</option></select></label>
      <label style="${S.dbs.length?'display:none':''}">New database name<input name="newDb" value="My leads"></label>
      <label>Next follow-up<input type="date" name="nextFollowUp" value="${esc(l.nextFollowUp)}"></label>
      <div class="full row between mt6">${n?'<span></span>':`<button type="button" class="btn ghost danger" data-act="delLead" data-id="${l.id}">${ico('trash')} Delete</button>`}<button class="btn primary">${n?'Add lead':'Save changes'}</button></div>
    </form>`,'wide');
}
function tplForm(t){const n=!t;t=t||{channel:'whatsapp',name:'',subject:'',body:''};
  openModal(`<div class="mh"><h3>${n?'New template':'Edit template'}</h3><button class="btn icon ghost" data-act="closeModal">${ico('x')}</button></div>
    <form data-form="tpl" data-id="${n?'':t.id}" class="fgrid">
      <label>Name<input name="name" value="${esc(t.name)}" required></label>
      <label>Channel<select name="channel"><option value="whatsapp" ${t.channel==='whatsapp'?'selected':''}>WhatsApp</option><option value="email" ${t.channel==='email'?'selected':''}>Email</option></select></label>
      <label class="full">Email subject (email only)<input name="subject" value="${esc(t.subject)}"></label>
      <label class="full">Message<textarea name="body" rows="9" required>${esc(t.body)}</textarea></label>
      <div class="full card" style="box-shadow:none;background:var(--bg2);padding:12px"><b class="small">WhatsApp automatic sending (Meta Cloud API)</b>
        <div class="xs muted mt6">WhatsApp only lets businesses start a conversation with a <b>Meta-approved template</b>. Create it in WhatsApp Manager → Message templates, wait for approval, then enter its name here. Leave blank to send the text above, which only works within 24h of the lead messaging you. One-click sending always uses the text above.</div>
        <div class="fgrid mt10"><label>Meta template name<input name="metaName" value="${esc(t.metaName||'')}" placeholder="e.g. intro_message"></label>
          <label>Language code<input name="metaLang" value="${esc(t.metaLang||'en')}" placeholder="en, en_US, hi"></label>
          <label class="full">Values for {{1}}, {{2}}… in order<input name="metaParams" value="${esc(t.metaParams||'')}" placeholder="e.g. firstName, myName, myCompany"></label></div></div>
      <div class="full xs muted">Placeholders: <span class="code">{{firstName}}</span> <span class="code">{{name}}</span> <span class="code">{{company}}</span> <span class="code">{{city}}</span> <span class="code">{{industry}}</span> <span class="code">{{myName}}</span> <span class="code">{{myCompany}}</span></div>
      <div class="full row end"><button class="btn primary">Save template</button></div></form>`,'wide')}

document.addEventListener('click',e=>{
  const bg=e.target.closest('[data-bg]');if(bg&&e.target===bg){closeModal();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const fn=ACT[a.dataset.act];if(fn){if(a.tagName==='A')e.preventDefault();fn(a,e)}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.name==='outcome'&&t.form?.dataset.form==='log'){const f=t.form,v=t.value,r=S.rules[v];
    f.elements.tpl.value=r&&S.templates.some(x=>x.id===r)?r:'';
    if(['callback','no_answer','busy','connected'].includes(v)&&!f.elements.follow.value)f.elements.follow.value=addDays(v==='connected'?3:1);
    if(['converted','not_interested','wrong'].includes(v))f.elements.follow.value='';
    f.elements.note.focus();return}
  if(t.dataset.on)ON[t.dataset.on]?.(t,e)});
let qT;document.addEventListener('input',e=>{if(e.target.dataset.oninput==='lfq'){clearTimeout(qT);qT=setTimeout(()=>{LF.q=e.target.value;LF.page=0;renderLeadsTable()},180)}
  if(e.target.dataset.oninput==='dfq'){clearTimeout(qT);qT=setTimeout(()=>{DF.q=e.target.value;DF.page=0;renderDirTable()},220)}});
document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();FORMS[k]?.(f,new FormData(f))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root .overlay'))closeModal()});
document.addEventListener('dragover',e=>{const d=e.target.closest?.('#dropzone');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest?.('#dropzone')?.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest?.('#dropzone');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readFile(f,null)}});
// new day while app is open
setInterval(()=>{if(S.daily.date&&S.daily.date!==today()){ensureDaily();render()}},60000);

/* boot */
(async function boot(){
  if(API.cloud){try{await window.SalesQuestCloud.ready}catch(e){return}}
  if(/^https?:$/.test(location.protocol)){
    try{await api('health');API.on=true;const r=await api('state');
      if(r.state){S=hydrate(r.state);API.rev=r.rev;LMAP=null}else API.fresh=true}
    catch(e){if(API.cloud){window.SalesQuestCloud.showFailure(e.message);return}API.on=false}
  }
  if(S.demo||S.leads.some(l=>l.demo))clearDemo();
  {ensureDirDbs();ensureArtificiaScript();const added=syncVCCI();save();if(added){topUpDaily();setTimeout(()=>toast(`Loaded ${fmtN(added)} companies from the VCCI 2024 directory`,'good',4000),300)}}
  if(S.leads.length)ensureDaily();
  ;
  if(API.on){await pushNow();poll();setInterval(poll,10000)}
  render();
})();
</script>
</body>
